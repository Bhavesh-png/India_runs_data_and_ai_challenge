ai_tools_used:
  - "Gemini"
  - "Cursor"

ai_usage_summary: |
  Used Gemini for architectural discussion, debugging, and code generation. Used Cursor as the primary IDE. No candidate data was sent to external LLMs during the execution of the ranker.

methodology_summary: |
  Hybrid semantic-behavioral ranker. Precomputed embeddings for the 100k candidate pool using a local Sentence-Transformers model. The online ranking computes cosine similarity between candidate embeddings and the JD, then applies structured checks: target experience curves, recruiter response rate activity, notice period, location compatibility, and job market availability multipliers. Incorporates a logical profile validator (honeypots filter) to exclude contradictory profiles. Completes in under 5 seconds on CPU.

declarations:
  read_submission_spec: true
  code_is_original_work: true
  no_collusion: true
  honeypot_check_done: true
  reproduction_tested: true
